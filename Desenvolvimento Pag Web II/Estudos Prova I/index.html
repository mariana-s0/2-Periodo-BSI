<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Revisão para Prova</h1>

    <section>
        <h2>1 - Mostrar/Ocultar Texto</h2>

        <button id="btnTexto">Mostrar/Ocultar</button>

        <p id="texto">
            Este texto será exibido ou ocultado.
        </p>
    </section>

    <section>
        <h2>2 - Alterar Cor de Fundo</h2>

        <button id="btnCor">
            Trocar Cor
        </button>
    </section>

    <section>
        <h2>3 - Inputs</h2>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome">

        <button id="btnNome">
            Mostrar Nome
        </button>

        <p id="saidaNome"></p>
    </section>

    <section>
        <h2>4 - Repetição com For</h2>

        <input
            type="text"
            id="textoFor"
            placeholder="Texto">

        <input
            type="number"
            id="numeroFor"
            placeholder="Quantidade">

        <button id="btnFor">
            Executar
        </button>
    </section>

    <section>
        <h2>5 - Array</h2>

        <button id="btnArray">
            Mostrar Array
        </button>
    </section>

    <section>
        <h2>6 - Objeto</h2>

        <button id="btnObjeto">
            Mostrar Objeto
        </button>
    </section>

    <section>
        <h2>7 - Aplicar Estilos</h2>

        <button id="btnBox">
            Aplicar
        </button>

        <div id="box"></div>
    </section>

    <section>
        <h2>8 - Criar Elementos</h2>

        <button id="btnCriar">
            Criar Parágrafo
        </button>

        <div id="area"></div>
    </section>

    <script src="script.js"></script>

</body>
</html>
