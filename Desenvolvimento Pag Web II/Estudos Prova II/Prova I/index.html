
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Prova 1 - Web II</title>
</head>
<body>

    <h1>Questão 1 - Contador</h1>

    <div class="contador">
        <button id="menos">-</button>
        <input type="text" id="valor" value="0">
        <button id="mais">+</button>
    </div>

    <hr>

    <h1>Questão 2 - Barra de progresso</h1>

    <div id="barra">
        <div id="progresso">50%</div>
    </div>

    <button id="configurar">Configurar</button>

    <hr>

    <h1>Questão 3 - Usuários</h1>

    <button id="media">a) Média das idades masculinas</button>
    <button id="enderecos">b) Números pares ou ímpares</button>
    <button id="maisVelha">c) Pessoa mais velha com nome terminado em "a"</button>

    <p>Abra o console do navegador (F12) para ver os resultados.</p>

    <script src="script.js"></script>
</body>
</html>
