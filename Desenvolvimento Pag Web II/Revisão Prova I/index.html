<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- QUESTÃO 1 -->
    <div class="centralizado">
        <button id="btnCor">Mudar Cor</button>
    </div>

    <hr>

    <!-- QUESTÃO 2 -->
    <div class="containerTexto">
        <button id="btnTexto">Mostrar / Ocultar Texto</button>

        <p id="paragrafo">
            Este é o texto que será exibido ou ocultado.
        </p>
    </div>

    <hr>

    <!-- QUESTÃO 3 -->
    <div class="containerInputs">

        <input
            type="text"
            id="txtTexto"
            placeholder="Digite um texto">

        <input
            type="number"
            id="txtNumero"
            placeholder="Digite um número">

        <button id="btnRepetir">
            Exibir no Console
        </button>

    </div>

    <hr>

    <!-- QUESTÃO 4 -->
    <div class="containerBox">

        <button id="btnBox">
            Aplicar Estilos
        </button>

        <div id="html_box"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
